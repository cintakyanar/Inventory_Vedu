<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory VernonEdu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HALAMAN LOGIN
    ========================== -->
    <div id="loginPage" class="login-page">

        <div class="login-left">

            <img 
                src="logovedu.png" 
                alt="Logo VernonEdu"
                class="logo-login"
            >

            <h1>Inventory Kantor</h1>

            <p>
                Sistem Peminjaman & Pengembalian Barang
            </p>

        </div>


        <div class="login-right">

            <div class="login-box">

                <h2>Selamat Datang 👋</h2>

                <p class="login-subtitle">
                    Silakan login untuk melanjutkan
                </p>


                <!-- Username -->
                <div class="form-group">

                    <label>Username</label>

                    <input 
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label>Password</label>

                    <input 
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                    >

                </div>


                <!-- Tombol Login -->
                <button 
                    class="btn-login"
                    onclick="login()"
                >
                    Login
                </button>


                <p class="login-info">
                    Belum memiliki akun?
                    <b>Hubungi Admin</b>
                </p>

            </div>

        </div>

    </div>



    <!-- =========================
         DASHBOARD
    ========================== -->

    <div id="dashboardPage" class="dashboard-page hidden">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-logo">

                <img 
                    src="logovedu.png"
                    alt="VernonEdu"
                >

                <h3>Inventory</h3>

                <span>Kantor</span>

            </div>


            <!-- MENU -->
            <nav>

                <button 
                    onclick="showPage('dashboard')"
                    class="menu active"
                >
                    🏠 Dashboard
                </button>


                <button 
                    onclick="showPage('barang')"
                    class="menu"
                >
                    📦 Data Barang
                </button>


                <button 
                    onclick="showPage('peminjaman')"
                    class="menu"
                >
                    📤 Peminjaman
                </button>


                <button 
                    onclick="showPage('pengembalian')"
                    class="menu"
                >
                    🔄 Pengembalian
                </button>


                <button 
                    onclick="showPage('reminder')"
                    class="menu"
                >
                    🔔 Reminder
                </button>


                <button 
                    onclick="showPage('riwayat')"
                    class="menu"
                >
                    📋 Riwayat
                </button>

            </nav>


            <button 
                class="logout"
                onclick="logout()"
            >
                ↪ Keluar
            </button>

        </aside>



        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="main-content">

            <!-- TOPBAR -->

            <header class="topbar">

                <div>

                    <h2 id="pageTitle">
                        Dashboard
                    </h2>

                    <p>
                        Sistem Inventory VernonEdu
                    </p>

                </div>


                <div class="topbar-right">

                    <button 
                        class="notification"
                        onclick="showPage('reminder')"
                    >
                        🔔
                        <span id="notificationCount">
                            0
                        </span>
                    </button>


                    <div class="user-info">

                        👤

                        <span id="userName">
                            Admin
                        </span>

                    </div>

                </div>

            </header>



            <!-- =========================
                 ISI HALAMAN
            ========================== -->

            <section 
                id="content"
                class="content"
            >

                <!-- Dashboard akan muncul dari JavaScript -->

            </section>

        </main>

    </div>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
